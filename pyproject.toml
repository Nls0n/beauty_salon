[project]
name = "beauty-salon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.5",
    "dotenv>=0.9.9",
    "pillow>=12.2.0",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "weasyprint>=68.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]


[tool.ruff]
target-version = "py313"

line-length = 150

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    
    "W",    
    "F",    
    "I",    
    "B",    
    "C4",   
    "UP",   
    "ASYNC",
    "RUF",  
]

ignore = [
    "B008", 
    "RUF001",
    "RUF012",
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = ["app", "core"] 

[tool.ruff.format]
quote-style = "double"       
indent-style = "space"         
skip-magic-trailing-comma = false
line-ending = "auto"
