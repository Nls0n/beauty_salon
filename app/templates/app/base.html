<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}BeautySalon{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Стили для печати: скрываем лишнее */
        @media print {
            .navbar, .btn, .no-print { display: none !important; }
            body { font-size: 12pt; }
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 no-print">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">BeautySalon</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Открыть меню">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'employee_list' %}">Мастера</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Дашборд</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'analytics' %}">Аналитика</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container" role="main">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
