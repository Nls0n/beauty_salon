{% extends 'app/base.html' %}
{% block title %}Список мастеров{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Управление мастерами</h2>
    <a href="{% url 'employee_create' %}" class="btn btn-success">+ Добавить мастера</a>
</div>

<table class="table table-bordered bg-white shadow-sm">
    <thead class="table-primary">
        <tr><th>ID</th><th>Имя</th><th>Специализация</th><th>Действия</th></tr>
    </thead>
    <tbody>
        {% for emp in employees %}
        <tr>
            <td>{{ emp.id }}</td>
            <td><a href="{% url 'employee_detail' emp.id %}">{{ emp.first_name }}</a></td>
            <td>{{ emp.specialty }}</td>
            <td>
                <a href="{% url 'employee_update' emp.id %}" class="btn btn-sm btn-warning">Редактировать</a>
                <a href="{% url 'employee_delete' emp.id %}" class="btn btn-sm btn-danger">Удалить</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
