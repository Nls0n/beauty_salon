<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список мастеров</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Бьюти-салон</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'home' %}">Главная</a>
            <a class="nav-link active" href="{% url 'employee_list' %}">Мастера (CRUD)</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Управление мастерами</h2>
        <a href="{% url 'employee_create' %}" class="btn btn-success">+ Добавить мастера</a>
    </div>

    <table class="table table-bordered table-hover bg-white shadow-sm">
        <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Специализация</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for emp in employees %}
            <tr>
                <td>{{ emp.id }}</td>
                <td><a href="{% url 'employee_detail' emp.id %}">{{ emp.first_name }}</a></td>
                <td>{{ emp.specialty }}</td>
                <td>
                    <a href="{% url 'employee_update' emp.id %}" class="btn btn-sm btn-warning">Редактировать</a>
                    <a href="{% url 'employee_delete' emp.id %}" class="btn btn-sm btn-danger">Удалить</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
