<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Удаление</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 text-center">
    <div class="alert alert-danger shadow-sm d-inline-block p-4">
        <h3>Вы уверены, что хотите удалить мастера "{{ employee.first_name }}"?</h3>
        <p>Это действие нельзя будет отменить.</p>
        <form method="post" class="mt-4">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-lg">Да, удалить</button>
            <a href="{% url 'employee_list' %}" class="btn btn-secondary btn-lg">Отмена</a>
        </form>
    </div>
</div>
</body>
</html>
